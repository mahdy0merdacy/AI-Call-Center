# Reusable jobs for a Python gRPC service. A service's child pipeline includes this
# file, sets SERVICE and SERVICE_DIR, and `extends:` the hidden jobs it needs.
#
# Contract with the parent pipeline (.gitlab-ci.yml), which passes these down:
#   PARENT_PIPELINE_SOURCE   merge_request_event | push | web | ...
#   PARENT_COMMIT_BRANCH     branch name on branch pipelines, empty on MR pipelines
#   MR_TARGET_BRANCH         target branch on MR pipelines, empty otherwise

variables:
  # Same base image as the service Dockerfiles: CI tests what production runs.
  PYTHON_IMAGE: python:3.12-slim-trixie@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2
  DOCKER_VERSION: "29.4.0"
  IMAGE: $CI_REGISTRY_IMAGE/$SERVICE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  interruptible: true          # a newer push to the same MR cancels this run

# ── python ─────────────────────────────────────────────────────────────────────

.python:
  image: $PYTHON_IMAGE
  cache:
    key:
      prefix: pip-$SERVICE
      files: [$SERVICE_DIR/requirements-dev.txt]
    paths: [.cache/pip]
  before_script:
    - cd "$SERVICE_DIR"
    - pip install -q -r requirements-dev.txt

.py-lint:
  extends: .python
  stage: verify
  script:
    - ruff check . --output-format gitlab --output-file "$CI_PROJECT_DIR/ruff.json"
      || { ruff check . --output-format concise; exit 1; }
  artifacts:
    when: always
    reports:
      codequality: ruff.json   # shown inline on the MR diff

.py-format:
  extends: .python
  stage: verify
  script:
    - ruff format --check --diff .

.py-typecheck:
  extends: .python
  stage: verify
  script:
    - mypy app tests

.py-test:
  extends: .python
  stage: test
  script:
    - pytest --junitxml="$CI_PROJECT_DIR/junit.xml"
      --cov=app --cov-report=term --cov-report="xml:$CI_PROJECT_DIR/coverage.xml"
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml           # failed tests listed on the MR
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml       # covered/uncovered lines on the MR diff

# ── containers ─────────────────────────────────────────────────────────────────

.hadolint:
  stage: verify
  image:
    name: hadolint/hadolint:v2.14.0-debian
    entrypoint: [""]
  script:
    - hadolint "$SERVICE_DIR/Dockerfile"

.docker:
  image: docker:${DOCKER_VERSION}-cli
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# Build once, push by commit SHA. Every later stage (scan, deploy, promote) uses
# this exact image; nothing is rebuilt on the way to production.
.docker-build:
  extends: .docker
  stage: build
  script:
    - docker buildx build
      --file "$SERVICE_DIR/Dockerfile"
      --cache-from "type=registry,ref=$IMAGE:main"
      --cache-to type=inline
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.created=$CI_PIPELINE_CREATED_AT"
      --tag "$IMAGE:$IMAGE_TAG"
      --push
      .
    - docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG"

# Fails on HIGH/CRITICAL vulnerabilities that have a fix available. Unfixable
# ones are reported but don't block: there is nothing to do about them yet.
.trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.65.0
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SKIP_VERSION_CHECK: "true"
    # Covers the whole run, DB download included (~80 MB; minutes on a slow link).
    TRIVY_TIMEOUT: 15m
  cache:
    key: trivy-db
    paths: [.trivycache]
    # Save even when the scan fails, or a timeout means re-downloading the DB on
    # every retry, which times out again.
    when: always
  script:
    # Report and gate share one filter, so the MR's test widget lists exactly
    # what blocks the pipeline (an unfiltered report shows ~160 "failures").
    - trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
      --format template --template "@/contrib/junit.tpl"
      --output junit-trivy.xml "$IMAGE:$IMAGE_TAG"
    - trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
      --exit-code 1 --skip-db-update "$IMAGE:$IMAGE_TAG"
  artifacts:
    when: always
    reports:
      junit: junit-trivy.xml

# On main only: tag the already-scanned image as `main`. Server-side retag, so the
# digest is identical to what was tested.
.docker-promote-main:
  extends: .docker
  stage: publish
  variables:
    GIT_STRATEGY: none
  script:
    - docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE:$IMAGE_TAG"
  rules:
    - if: $PARENT_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
