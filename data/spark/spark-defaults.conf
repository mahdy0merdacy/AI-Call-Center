# Delta Lake as the table format.
spark.sql.extensions                     io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog          org.apache.spark.sql.delta.catalog.DeltaCatalog

# The lake: SeaweedFS speaking S3. Path-style because there is no DNS per bucket.
spark.hadoop.fs.s3a.endpoint             http://seaweedfs:8333
spark.hadoop.fs.s3a.endpoint.region      us-east-1
spark.hadoop.fs.s3a.path.style.access    true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl                 org.apache.hadoop.fs.s3a.S3AFileSystem

# Small machine: 6 shuffle partitions (= Kafka partitions), not the default 200.
spark.sql.shuffle.partitions             6
spark.sql.session.timeZone               UTC
spark.ui.port                            4040

# Skip S3A's "is any parent path a file?" probe on create. SeaweedFS answers
# that probe in a way S3A misreads ("parent is not a dir"), and on real S3 each
# probe is a billed round trip. Safe here: only Spark writes under these paths.
spark.hadoop.fs.s3a.create.performance   true

