# buf config for the analytical event schema. CI runs `buf lint` and, on merge
# requests, `buf breaking` against the target branch.
version: v2
lint:
  use:
    - STANDARD
  except:
    # PII_NONE = 0 is a real class ("not personal data"), not a missing value, and
    # renaming it would change the JSON and the generated code every reader uses.
    - ENUM_ZERO_VALUE_SUFFIX
breaking:
  use:
    # Records in Kafka and the lake are read for months by consumers on older and
    # newer code. WIRE_JSON blocks what breaks them: a reused or retyped field
    # number, a renamed JSON field. This is the forward-compatibility gate; the
    # Schema Registry (BACKWARD_TRANSITIVE) checks the other direction at publish.
    - WIRE_JSON
