# Data platform child pipeline. Triggered by the root .gitlab-ci.yml when the
# event schema, the Spark jobs, the quality checks or the simulator change.
#
#   verify ─► test
#
# No image build here yet: the Spark jobs run on the stock Spark Connect server
# and the Airflow image is built locally (data/docker-compose.yml).

variables:
  # Same base image as the services: CI tests what production runs.
  PYTHON_IMAGE: python:3.12-slim-trixie@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GRPCIO_TOOLS: grpcio-tools==1.84.0   # must match the services' grpcio
  BUF_IMAGE: bufbuild/buf:1.57.0

stages: [verify, test]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"

default:
  interruptible: true

.python:
  image: $PYTHON_IMAGE
  cache:
    key:
      prefix: pip-data
      files: [data/quality/requirements.txt]
    paths: [.cache/pip]

# ── verify ─────────────────────────────────────────────────────────────────────

lint:
  extends: .python
  stage: verify
  script:
    - pip install -q ruff==0.17.1
    - cd data
    - ruff check . --output-format gitlab --output-file "$CI_PROJECT_DIR/ruff.json"
      || { ruff check . --output-format concise; exit 1; }
  artifacts:
    when: always
    reports:
      codequality: ruff.json

schema-lint:
  stage: verify
  image:
    name: $BUF_IMAGE
    entrypoint: [""]
  script:
    - cd data/proto
    - buf lint

# The schema is a contract with data already written: months of Kafka records
# and Delta tables, read by consumers on older and newer code. A renumbered or
# retyped field corrupts every one of them, so it is blocked here, at review.
schema-breaking:
  stage: verify
  image:
    name: $BUF_IMAGE
    entrypoint: [""]
  script:
    - cd data/proto
    - buf breaking --against
      "${CI_REPOSITORY_URL}#branch=${MR_TARGET_BRANCH},subdir=data/proto"
  rules:
    - if: $MR_TARGET_BRANCH

# data/gen/, libs/aicc_events/events_pb2.* and services/sentiment/gen/ are committed, so they must match
# events.proto. Regenerate and compare: an edited .proto without a regenerated
# library would publish events Spark cannot decode.
schema-generated:
  extends: .python
  stage: verify
  script:
    - pip install -q "$GRPCIO_TOOLS"
    - cp -r data/gen /tmp/gen-data && cp -r libs/aicc_events /tmp/gen-libs
    - cp -r services/sentiment/gen /tmp/gen-sentiment
    - PYTHON=python data/gen.sh
    - |
      if ! diff -r /tmp/gen-data data/gen || ! diff -r /tmp/gen-libs libs/aicc_events \
         || ! diff -r /tmp/gen-sentiment services/sentiment/gen; then
        echo "generated code is stale: run data/gen.sh and commit the result"
        exit 1
      fi

# ── test ───────────────────────────────────────────────────────────────────────

# Forward/backward compatibility, PII classification on every string field.
schema-tests:
  extends: .python
  stage: test
  needs: [schema-generated]
  script:
    - pip install -q "$GRPCIO_TOOLS"
    - python data/tests/test_events.py

# Every quality rule fires on the fault it is for and passes clean data.
# No lake needed: the tests build their own frames.
quality-tests:
  extends: .python
  stage: test
  script:
    - pip install -q -r data/quality/requirements.txt pytest==9.2.0
    - python -m pytest data/quality/tests -q --junitxml="$CI_PROJECT_DIR/junit.xml"
  artifacts:
    when: always
    reports:
      junit: junit.xml
