# Documents service pipeline. Started by the root .gitlab-ci.yml (job `documents`) only
# when files under services/documents/, ci/templates/ or the root file change.
#
#   verify ─► test ─► build ─► scan ─► publish (default branch only)
#
# Every job except `tests` comes from ci/templates/django-service.yml, shared with the
# auth service (services/tenant-portal), so both services are checked, built and
# scanned identically. What stays here is what genuinely differs: this service's
# variables and its tests (Django's runner against a throwaway MongoDB).
#
# CI/CD variables: none of its own. The tests use dummy values and sign their own JWTs;
# the registry jobs use GitLab's predefined CI_REGISTRY_* variables.

include:
  - local: ci/templates/django-service.yml

# Only as a child of the root pipeline, never on its own.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"

stages: [verify, test, build, scan, publish]

variables:
  SERVICE: documents
  SERVICE_DIR: services/documents
  APP_DIR: "."
  BUILD_CONTEXT: services/documents
  COVERAGE_MIN: "90"
  BANDIT_EXCLUDE: "./documents/tests.py,./documents/migrations,./venv"

# ── verify ─────────────────────────────────────────────────────────────────────

lint:
  extends: .django-lint

format:
  extends: .django-format

dockerfile:
  extends: .django-dockerfile

sast:
  extends: .django-sast

deps-scan:
  extends: .django-deps-scan

iac:
  extends: .django-iac

# ── test ───────────────────────────────────────────────────────────────────────

tests:
  extends: .django-tests
  services:
    # Throwaway database, deleted when the job ends.
    - name: mongo:7
      alias: mongo
  variables:
    MONGODB_URI: "mongodb://mongo:27017"
    MONGODB_DB: ci
    # Dummy values for the test run only; the tests sign their own throwaway JWT keys.
    DJANGO_DEBUG: "true"
    DJANGO_SECRET_KEY: ci-only-not-a-secret
  script:
    - python manage.py check
    # Fails if a model change was committed without its migration.
    - python manage.py makemigrations --check --dry-run
    - coverage run manage.py test --noinput -v 2
    - mkdir -p "$CI_PROJECT_DIR/reports"
    - coverage xml -o "$CI_PROJECT_DIR/reports/coverage.xml"
    - coverage report --fail-under="$COVERAGE_MIN"

bandit:
  extends: .django-bandit

# ── build / scan / publish ─────────────────────────────────────────────────────

build-image:
  extends: .docker-build
  needs: [lint, format, dockerfile, sast, deps-scan, iac, tests, bandit]

scan-image:
  extends: .trivy-scan
  needs: [build-image]

sbom:
  extends: .sbom
  needs: [build-image]

publish-main:
  extends: .docker-promote-main
  needs: [scan-image, sbom]
