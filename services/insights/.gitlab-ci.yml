# Insights API child pipeline. Started by the root .gitlab-ci.yml when files under
# services/insights/ or the shared CI templates change.
#
#   verify ─► test ─► build ─► scan ─► publish (default branch only)
#
# Jobs come from ci/templates/python-service.yml, shared with the orchestrator.

include:
  - local: ci/templates/python-service.yml

variables:
  SERVICE: insights
  SERVICE_DIR: services/insights
  BUILD_CONTEXT: services/insights   # the Dockerfile copies paths relative to this folder

stages: [verify, test, build, scan, publish]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"

# ── verify ─────────────────────────────────────────────────────────────────────

lint:
  extends: .py-lint

format:
  extends: .py-format

typecheck:
  extends: .py-typecheck

dockerfile:
  extends: .hadolint

# ── test ───────────────────────────────────────────────────────────────────────

# The tests run against a real Postgres (same major as the data stack): the SQL is
# the point of this service. Locally they start a throwaway container instead.
unit-tests:
  extends: .py-test
  services:
    - name: postgres:18
      alias: postgres
  variables:
    POSTGRES_PASSWORD: postgres
    INSIGHTS_TEST_ADMIN_URL: postgresql://postgres:postgres@postgres:5432/postgres

# ── build / scan / publish ─────────────────────────────────────────────────────

build-image:
  extends: .docker-build
  needs: [lint, format, typecheck, dockerfile, unit-tests]

scan-image:
  extends: .trivy-scan
  needs: [build-image]

sbom:
  extends: .sbom
  needs: [build-image]

publish-main:
  extends: .docker-promote-main
  needs: [scan-image, sbom]
