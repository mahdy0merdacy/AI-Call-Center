# The core app as containers on one machine: the voice pipeline (edge, stt, tts,
# orchestrator), the MCP tool servers, the Django platform (portal = auth,
# documents), RAG (knowledge + ingestion), Postgres, MongoDB, Mailpit and the web
# gateway. No data stack (Kafka, Spark, Airflow): that is data/docker-compose.yml.
#
#   scripts/core-up.sh       # setup if needed, build, start, wait until healthy
#   scripts/core-check.sh    # probe every container-to-container call, by DNS name
#   scripts/core-down.sh     # stop; data volumes are kept
#
# Built to move to k3s unchanged (deploy/README.md, "k3s mapping"):
#   * one network, and services find each other ONLY by service name, which
#     become Kubernetes Service names;
#   * configuration ONLY from environment variables (later: Secret + ConfigMap);
#   * a health check on every service that listens (= its k8s probe) and a
#     memory limit on everything (= resources.limits.memory).
#
# Published on 127.0.0.1 only, so nothing reaches the LAN:
#   8080 web: portal UI + API gateway     8082 edge: voice test page + WebRTC
#   8025 Mailpit UI                       5434 Postgres, for psql while debugging
# (On the dev laptop 5432, 8001-8003, 5000, 6443 and 10250 are already taken.)
#
# Secrets: deploy/.env, generated by scripts/core-setup.sh (gitignored).
# GROQ_API_KEY (and optional LLM_URL / LLM_MODEL): the repo's root .env. For the
# LLM on predator (deploy/k3s/60-llm), with Groq as the fallback:
#   LLM_URL=http://100.99.90.2:30800/v1/chat/completions   LLM_MODEL=qwen3-8b
#
# GPU: stt and tts need the NVIDIA Container Toolkit on the host (`gpus: all`).
# Models are mounted from the host caches; nothing downloads at runtime.

name: aicc-core

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

# Every long-running service.
x-service: &service
  restart: unless-stopped
  networks: [aicc]
  logging: *logging

# Our images run as non-root and bind ports above 1024, so they need no
# capabilities at all (k8s: capabilities.drop [ALL], allowPrivilegeEscalation false).
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# One-shot jobs (k8s: Jobs). Idempotent, so they run on every `up`.
x-job: &job
  restart: "no"
  networks: [aicc]
  logging: *logging
  mem_limit: 256m

services:

  # ── databases ──────────────────────────────────────────────────────────────

  postgres:
    <<: *service
    build: ../services/tenant-portal/db/postgres
    image: aicc/postgres:dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenant_portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/core-setup.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    mem_limit: 512m
    healthcheck:
      # Over TCP: while the init SQL runs, Postgres listens on its Unix socket
      # only, so this stays unhealthy until the schema exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
      start_interval: 2s

  # The voice side reads Postgres as voice_reader: tenant identities and document
  # chunks, nothing else. Applied with the portal's owner role, every `up`.
  db-grants:
    <<: [*job, *hardened]
    image: aicc/postgres:dev
    pull_policy: never              # built by the postgres service
    user: postgres
    command: ["psql", "--no-psqlrc", "--quiet", "-f", "/grants/grants.sql"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-tenant_portal}
      PGUSER: ${POSTGRES_USER:-portal}
      PGPASSWORD: ${POSTGRES_PASSWORD:?run scripts/core-setup.sh}
      VOICE_READER_PASSWORD: ${VOICE_READER_PASSWORD:?run scripts/core-setup.sh}
    volumes:
      - ./postgres/grants.sql:/grants/grants.sql:ro,z
    depends_on:
      postgres: {condition: service_healthy}

  mongo:
    <<: *service
    build: ../services/documents/db/mongo
    image: aicc/mongo:dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run scripts/core-setup.sh}
      MONGODB_DB: documents         # read by the image's init.js
    volumes:
      - mongo-data:/data/db
    # No published port: only documents and ingestion talk to it. WiredTiger
    # sizes its cache from this limit (256 MB at 768m).
    mem_limit: 768m
    healthcheck:
      # Through the container's hostname, not localhost: while init.js runs,
      # mongod listens on localhost only, so this stays unhealthy until then.
      test: ["CMD-SHELL", "mongosh --quiet --host \"$$(hostname)\" --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
      start_interval: 2s

  # The documents app's own user (readWrite on "documents" only), created or
  # refreshed with the root credentials, which no app ever sees.
  mongo-setup:
    <<: [*job, *hardened]
    image: aicc/mongo:dev
    pull_policy: never              # built by the mongo service
    # A shell only so the root password comes from the environment, not the
    # command line stored in the container's config.
    command:
      - sh
      - -c
      - >-
        exec mongosh --host mongo --quiet --authenticationDatabase admin
        --username "$$MONGO_ROOT_USER" --password "$$MONGO_ROOT_PASSWORD"
        /setup/mongo-setup.js
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-root}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run scripts/core-setup.sh}
      APP_DB: documents
      APP_USER: ${MONGO_APP_USER:-documents_app}
      APP_PASSWORD: ${MONGO_APP_PASSWORD:?run scripts/core-setup.sh}
    volumes:
      - ../services/documents/docker/mongo-setup.js:/setup/mongo-setup.js:ro,z
    healthcheck: {disable: true}    # the image's check pings a mongod this job does not run
    depends_on:
      mongo: {condition: service_healthy}

  # Catches every email the portal sends (verification, password reset).
  mailpit:
    <<: *service
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"       # UI; SMTP (1025) stays internal
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

  # ── platform ───────────────────────────────────────────────────────────────

  # Auth service and JWT issuer (RS256).
  portal:
    <<: [*service, *hardened]
    build: ../services/tenant-portal
    image: aicc/portal:dev
    # 2 workers instead of the image's 3: a laptop, and Argon2 takes ~100 MB per
    # password hash in flight.
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000",
              "--workers", "2", "--timeout", "30", "--access-logfile", "-"]
    environment:
      # Dev settings with DEBUG off: prod settings demand HTTPS everywhere, and
      # this stack is plain HTTP on localhost.
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "false"
      DJANGO_SECRET_KEY: ${PORTAL_SECRET_KEY:?run scripts/core-setup.sh}
      DATABASE_URL: postgres://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD:?run scripts/core-setup.sh}@postgres:5432/${POSTGRES_DB:-tenant_portal}
      # The init SQL records every migration as applied, so this is a no-op on a
      # fresh volume and applies only migrations added since (k8s: a Job).
      RUN_MIGRATIONS: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,portal,web
      NUM_PROXIES: "1"              # the web gateway's X-Forwarded-For
      FRONTEND_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      REFRESH_COOKIE_SECURE: "false"
      JWT_PRIVATE_KEY_PATH: /keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      JWT_ISSUER: tenant-portal
      JWT_AUDIENCE: ai-voice-platform
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?run scripts/core-setup.sh}
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "false"
      DEFAULT_FROM_EMAIL: AI Voice <no-reply@aivoice.local>
      # Test tenants' slugs: a company named "Acme" must not shadow them.
      RESERVED_TENANT_SLUGS: acme,swiftnet,maisonverte
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LOG_LEVEL: INFO
    volumes:
      - ./keys:/keys:ro,z
    # The private key is mode 640 and owned by you; this group lets uid 10001
    # read it without making it world-readable (k8s: fsGroup on the Secret).
    group_add: ["${AICC_GID:-1000}"]
    mem_limit: 768m
    healthcheck: &django-health
      # The image's own check (liveness at its HEALTH_PATH), probed every 2 s while
      # starting instead of every 15 s.
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen('http://127.0.0.1:8000' + os.environ['HEALTH_PATH'], timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    depends_on:
      postgres: {condition: service_healthy}
      mailpit: {condition: service_healthy}

  # Tenant documents on MongoDB; verifies portal JWTs with the public key only.
  documents:
    <<: [*service, *hardened]
    build: ../services/documents
    image: aicc/documents:dev
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000",
              "--workers", "2", "--timeout", "30", "--access-logfile", "-"]
    environment:
      DJANGO_SECRET_KEY: ${DOCUMENTS_SECRET_KEY:?run scripts/core-setup.sh}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: documents,web,localhost,127.0.0.1
      MONGODB_URI: mongodb://${MONGO_APP_USER:-documents_app}:${MONGO_APP_PASSWORD:?run scripts/core-setup.sh}@mongo:27017/documents?authSource=documents
      MONGODB_DB: documents
      MAX_UPLOAD_SIZE_MB: "25"
      SESSION_LINK_BASE_URL: http://localhost:8082/s
      # PEM on one line with literal \n, the form the service parses.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run scripts/core-setup.sh}
      JWT_ISSUER: tenant-portal
      JWT_AUDIENCE: ai-voice-platform
      JWT_TENANT_CLAIM: tenant_id
      JWT_ALLOWED_ROLES: tenant_admin
    volumes:
      - media:/data/media
    mem_limit: 512m
    healthcheck: *django-health
    depends_on:
      mongo-setup: {condition: service_completed_successfully}

  # The React portal plus a same-origin reverse proxy to portal and documents,
  # so the browser needs no CORS. Upstreams are resolved per request.
  web:
    <<: [*service, *hardened]
    build:
      context: ../tenant-portal
      args:
        VITE_API_BASE_URL: ""
        VITE_DOCUMENTS_API_URL: ""
    image: aicc/web:dev
    environment:
      PORTAL_UPSTREAM: http://portal:8000
      DOCUMENTS_UPSTREAM: http://documents:8000
      DNS_RESOLVER: 127.0.0.11      # Docker's embedded DNS; the cluster DNS IP on k3s
      VOICE_TEST_URL: http://localhost:8082
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    depends_on:
      portal: {condition: service_healthy}
      documents: {condition: service_healthy}

  # ── RAG ────────────────────────────────────────────────────────────────────

  # Holds the ONE bge-m3 in RAM: embeds for ingestion and searches for calls.
  knowledge:
    <<: [*service, *hardened]
    build: ../services/ingestion
    image: aicc/ingestion:dev
    command: ["python", "-m", "ingestion.api"]
    environment:
      DATABASE_URL: postgresql://voice_reader:${VOICE_READER_PASSWORD:?run scripts/core-setup.sh}@postgres:5432/${POSTGRES_DB:-tenant_portal}
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_THREADS: "2"
      PORT: "8100"
      HF_HOME: /models/huggingface
      HF_HUB_OFFLINE: "1"           # pre-downloaded on the host; never fetch at runtime
    volumes:
      - ${HOME}/.cache/huggingface:/models/huggingface:ro,z
    # bge-m3 is ~2.3 GB of weights in fp32. Two CPUs, as EMBEDDING_THREADS: a
    # document being embedded must never starve live calls.
    mem_limit: ${KNOWLEDGE_MEMORY:-3584m}
    cpus: 2
    healthcheck:
      # 200 only once the model is loaded and Postgres answers.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 240s
      start_interval: 5s
    depends_on:
      db-grants: {condition: service_completed_successfully}

  # Turns uploads into document_chunks. Embeds through knowledge, so it holds no
  # model. No port and no health endpoint: a crash restarts it, which is all a
  # k8s liveness probe would add.
  ingestion:
    <<: [*service, *hardened]
    image: aicc/ingestion:dev
    pull_policy: never              # built by the knowledge service
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USER:-documents_app}:${MONGO_APP_PASSWORD:?run scripts/core-setup.sh}@mongo:27017/documents?authSource=documents
      MONGODB_DB: documents
      # Writes document_chunks as the portal's owner role (unchanged design).
      DATABASE_URL: postgresql://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD:?run scripts/core-setup.sh}@postgres:5432/${POSTGRES_DB:-tenant_portal}
      EMBEDDING_URL: http://knowledge:8100
      EMBEDDING_MODEL: BAAI/bge-m3
      POLL_INTERVAL_SECONDS: "5"
      STUCK_AFTER_MINUTES: "10"
    volumes:
      - media:/data/media:ro        # documents writes uploads, this only reads
    mem_limit: 768m
    cpus: 1
    depends_on:
      mongo-setup: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      knowledge: {condition: service_healthy}

  # ── voice ──────────────────────────────────────────────────────────────────

  mcp-acme:
    <<: [*service, *hardened]
    build: {context: .., dockerfile: services/mcp-servers/Dockerfile}
    image: aicc/mcp-servers:dev
    command: ["acme_delivery.py", "--host", "0.0.0.0", "--port", "9101"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9101), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s

  mcp-swiftnet:
    <<: [*service, *hardened]
    image: aicc/mcp-servers:dev
    pull_policy: never              # built by mcp-acme
    command: ["swiftnet_isp.py", "--host", "0.0.0.0", "--port", "9102"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9102), 3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s

  # Dialogue engine: text in, directives out. Resolves tenants from the YAML
  # test tenants first, then the platform's accounts_tenant (as voice_reader).
  orchestrator:
    <<: [*service, *hardened]
    build: {context: .., dockerfile: services/orchestrator/Dockerfile}
    image: aicc/orchestrator:dev
    # GROQ_API_KEY, plus LLM_URL / LLM_MODEL when the defaults do not suit.
    # Optional so the stack still starts without it (the agent then cannot reply).
    env_file:
      - path: ../.env
        required: false
    environment:
      TENANTS_DIR: /srv/aicc/tenants
      PLATFORM_DATABASE_URL: postgresql://voice_reader:${VOICE_READER_PASSWORD:?run scripts/core-setup.sh}@postgres:5432/${POSTGRES_DB:-tenant_portal}
      KNOWLEDGE_URL: http://knowledge:8100
      MCP_SERVERS: lookup_shipment=http://mcp-acme:9101/mcp,reschedule_delivery=http://mcp-acme:9101/mcp,check_line_status=http://mcp-swiftnet:9102/mcp
      SHUTDOWN_GRACE_S: "25"        # < stop_grace_period, so calls drain before SIGKILL
    volumes:
      # The live tenant configs over the image's baked copy (k8s: a ConfigMap).
      - ../tenants:/srv/aicc/tenants:ro,z
    mem_limit: 512m
    stop_grace_period: 30s
    healthcheck:
      # Standard gRPC health; NOT_SERVING as soon as a drain starts.
      test: ["CMD", "python", "-c", "import grpc; from grpc_health.v1 import health_pb2 as h, health_pb2_grpc as g; r = g.HealthStub(grpc.insecure_channel('127.0.0.1:50052')).Check(h.HealthCheckRequest(), timeout=3); raise SystemExit(r.status != h.HealthCheckResponse.SERVING)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    depends_on:
      mcp-acme: {condition: service_healthy}
      mcp-swiftnet: {condition: service_healthy}
      db-grants: {condition: service_completed_successfully}
      # Started, not healthy: loading the model takes a minute, and the test
      # tenants do not use RAG, so their calls must not wait for it.
      knowledge: {condition: service_started}

  stt:
    <<: [*service, *hardened]
    build: {context: .., dockerfile: services/stt/Dockerfile}
    image: aicc/stt:dev
    volumes:
      - ${HOME}/.cache/whisper:/models/whisper:ro,z
    gpus: all
    mem_limit: 6g
    stop_grace_period: 30s          # drains open streams before exiting
    healthcheck:
      # SERVING only after the model is loaded and warmed up.
      test: ["CMD", "python", "-c", "import grpc; from grpc_health.v1 import health_pb2 as h, health_pb2_grpc as g; r = g.HealthStub(grpc.insecure_channel('127.0.0.1:50051')).Check(h.HealthCheckRequest(), timeout=3); raise SystemExit(r.status != h.HealthCheckResponse.SERVING)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 3s

  tts:
    <<: [*service, *hardened]
    build: {context: .., dockerfile: services/tts/Dockerfile}
    image: aicc/tts:dev
    volumes:
      - ${HOME}/.cache/nemo-speech/models:/models/nemo-speech:z
    # nemo-speech writes a .lock beside each model, and this cache belongs to you,
    # not the image's uid 10001. In k3s an init container fills the cache as 10001.
    user: "${AICC_UID:-1000}:${AICC_GID:-1000}"
    gpus: all
    mem_limit: 3g
    healthcheck:
      # /ready answers 200 only once the engine is loaded.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8083/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 3s

  # WebRTC in, gRPC/HTTP out. On this bridge network its ICE candidates are the
  # container's address, which only THIS machine can route to: fine for a browser
  # on the laptop. Remote callers need hostNetwork (the k3s plan) or TURN.
  edge:
    <<: [*service, *hardened]
    build: {context: .., dockerfile: services/media-edge/Dockerfile}
    image: aicc/media-edge:dev
    # Replaces the image's CMD, whose upstream flags point at 127.0.0.1 (the old
    # host-network setup); upstreams now come from the environment below.
    command: ["--host", "0.0.0.0", "--port", "8082"]
    environment:
      STT_ADDR: stt:50051
      ORCHESTRATOR_ADDR: orchestrator:50052
      TTS_URL: http://tts:8083
      DEFAULT_TENANT: acme
    ports:
      - "127.0.0.1:8082:8082"
    mem_limit: 512m
    stop_grace_period: 30s          # aiohttp closes open calls on SIGTERM
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8082/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s
    depends_on:
      orchestrator: {condition: service_healthy}
      stt: {condition: service_healthy}
      tts: {condition: service_healthy}

networks:
  aicc:
    driver: bridge

volumes:
  pgdata:
  mongo-data:
  # Uploaded files: documents writes, ingestion reads. A local volume, i.e. one
  # node; shared object storage replaces it before replicas or a second node.
  media:
