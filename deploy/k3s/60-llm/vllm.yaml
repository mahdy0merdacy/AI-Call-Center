# Weights, vLLM's compile cache and Hugging Face downloads, so a restart neither
# downloads the model again nor recompiles (minutes each on a first start).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-models
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 30Gi}}
---
# llm.aicc-llm.svc:8000 for the orchestrator; NodePort 30800 for a dev
# orchestrator outside the cluster (LLM_URL=http://localhost:30800/v1/chat/completions
# on any node). No API key, like every other service here: the tailnet is the boundary.
apiVersion: v1
kind: Service
metadata:
  name: llm
spec:
  type: NodePort
  selector: {app: llm}
  ports:
    - {name: http, port: 8000, nodePort: 30800}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
spec:
  replicas: 1
  # One GPU: the old pod must free it before the new one can load.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: llm}
  template:
    metadata:
      labels: {app: llm}
    spec:
      nodeSelector: {aicc.io/role: llm}
      runtimeClassName: nvidia
      containers:
        - name: vllm
          # predator's RTX 5070 is Blackwell (sm_120): needs a CUDA >= 12.8 build.
          image: vllm/vllm-openai:v0.33.0
          args:
            - --model=Qwen/Qwen3-8B-AWQ
            # The name the orchestrator sends as LLM_MODEL.
            - --served-model-name=qwen3-8b
            - --port=8000
            # 12 GB card, 1-3 GB of it held by the Windows desktop (WSL2). 0.75
            # = ~8.9 GB: 6.1 GB of weights, the rest KV cache (~14k tokens).
            - --gpu-memory-utilization=0.75
            # A call's prompt is a few thousand tokens; replies are capped at 180.
            - --max-model-len=8192
            - --max-num-seqs=8
            - --enable-prefix-caching
            # Qwen3 thinks before answering by default: seconds of silence on a call.
            - '--default-chat-template-kwargs={"enable_thinking": false}'
          env:
            - {name: HF_HOME, value: /models/hf}
            - {name: VLLM_CACHE_ROOT, value: /models/vllm-cache}
          ports:
            - {name: http, containerPort: 8000}
          # First start: download + load + compile, up to ~20 min on predator's link.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            limits: {nvidia.com/gpu: 1, memory: 8Gi}
            requests: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: shm, mountPath: /dev/shm}
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: llm-models}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
