# Under Argo CD: a PostSync hook. It runs after each sync, once everything
# else in the layer is healthy (the database is up), and is replaced on the
# next sync instead of showing as missing after ttlSecondsAfterFinished.
# One-shot setup, idempotent (what data/setup.sh does in compose). Each fails
# while its server is not up yet and backoffLimit retries it.

# Topics: same list and settings as data/kafka/topics.sh, with the Kafka tools
# run in a pod instead of `docker exec kafka-1`.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector: {aicc.io/role: llm}
      containers:
        - name: topics
          image: apache/kafka:4.3.1
          command:
            - bash
            - -ec
            - |
              B=kafka-1:19092; T=/opt/kafka/bin; DAY=86400000; MB=1048576
              for row in "calls.events.v1|6|delete|$((7*DAY))|$((256*MB))" \
                         "calls.partials.v1|6|delete|$((1*DAY))|$((64*MB))" \
                         "calls.summary.v1|6|compact|-1|-1" \
                         "calls.sentiment.v1|6|delete|$((7*DAY))|$((256*MB))" \
                         "dlq.calls.events.v1|1|delete|$((14*DAY))|$((256*MB))"; do
                IFS='|' read -r name parts cleanup ret_ms ret_bytes <<<"$row"
                cfg="cleanup.policy=$cleanup,retention.ms=$ret_ms,retention.bytes=$ret_bytes,message.timestamp.type=LogAppendTime,min.insync.replicas=1"
                if $T/kafka-topics.sh --bootstrap-server $B --list | grep -qx "$name"; then
                  $T/kafka-configs.sh --bootstrap-server $B --alter --entity-type topics --entity-name "$name" --add-config "$cfg" >/dev/null
                  echo "updated  $name"
                else
                  $T/kafka-topics.sh --bootstrap-server $B --create --topic "$name" --partitions "$parts" \
                    --replication-factor 1 $(echo "$cfg" | tr ',' '\n' | sed 's/^/--config /') >/dev/null
                  echo "created  $name"
                fi
              done
---
# Schemas: data/kafka/register_schemas.py, run as is against the in-cluster
# registry. It finds the .proto relative to itself, hence the folder layout.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-schemas
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector: {aicc.io/role: llm}
      containers:
        - name: schemas
          image: python:3.12-slim-trixie@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2
          command: ["python", "/work/kafka/register_schemas.py", "--registry", "http://schema-registry:8081"]
          volumeMounts:
            - {name: schema, mountPath: /work/kafka/register_schemas.py, subPath: register_schemas.py}
            - {name: schema, mountPath: /work/proto/aicallcenter/events/v1/events.proto, subPath: events.proto}
      volumes:
        - name: schema
          configMap: {name: event-schema}
---
# The lake bucket on SeaweedFS.
apiVersion: batch/v1
kind: Job
metadata:
  name: lake-bucket
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      nodeSelector: {aicc.io/role: llm}
      containers:
        - name: bucket
          image: chrislusf/seaweedfs:4.00
          command:
            - sh
            - -ec
            - |
              if echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 2>/dev/null | grep -qw lake; then
                echo "bucket lake exists"
              else
                echo "s3.bucket.create -name lake" | weed shell -master=seaweedfs:9333
                echo "bucket lake created"
              fi
