# The values that name THIS environment (deploy/README.md, "Per-environment
# values"). Everything else is the same as in compose. Change them here, then
# `kubectl rollout restart deploy/<name>`: pods read env only when they start.
#
# Where the browser reaches things on this cluster:
#   portal + API   http://localhost:30808   (web's NodePort, from fedora; any node IP works)
#   voice page     http://localhost:8082    (edge on fedora's host network)
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-env
data:
  # Host headers Django accepts: the browser's (node IPs, localhost), the
  # gateway's and the Service names.
  ALLOWED_HOSTS: localhost,127.0.0.1,100.72.101.66,100.111.19.119,100.99.90.2,portal,portal.aicc.svc.cluster.local,web
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,100.72.101.66,100.111.19.119,100.99.90.2,documents,documents.aicc.svc.cluster.local,web
  FRONTEND_URL: http://localhost:30808          # links in emails point here
  CORS_ALLOWED_ORIGINS: http://localhost:30808
  REFRESH_COOKIE_SECURE: "false"                # plain HTTP for the demo
  SESSION_LINK_BASE_URL: http://localhost:8082/s
  VOICE_TEST_URL: http://localhost:8082
  RESERVED_TENANT_SLUGS: acme,swiftnet,maisonverte
