# The React portal + a same-origin reverse proxy to portal and documents.
# Exposed as a NodePort (k3s here runs without Traefik): http://<any node>:30808
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - {name: http, port: 8080, nodePort: 30808}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      nodeSelector: {aicc.io/role: platform}
      securityContext:
        runAsUser: 101          # nginx-unprivileged's user
        runAsGroup: 101
        runAsNonRoot: true
      containers:
        - name: web
          image: aicc/web
          env:
            # nginx's resolver ignores resolv.conf search domains: full names, and
            # the cluster DNS (kube-dns) instead of Docker's 127.0.0.11.
            - {name: PORTAL_UPSTREAM, value: "http://portal.aicc.svc.cluster.local:8000"}
            - {name: DOCUMENTS_UPSTREAM, value: "http://documents.aicc.svc.cluster.local:8000"}
            - {name: DNS_RESOLVER, value: 10.43.0.10}
            - name: VOICE_TEST_URL
              valueFrom: {configMapKeyRef: {name: platform-env, key: VOICE_TEST_URL}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
